<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할 일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#1B2437; --muted:#6B7488; --line:#DDE2EC;
  --study:#2F5BEA; --study-bg:#E5ECFF; --life:#0E8F6B; --life-bg:#DDF4EB;
  --accent:#1B2437; --accent-ink:#FFFFFF; --danger:#C93C3C; --track:#DDE2EC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141D; --surface:#19202D; --ink:#E7EBF3; --muted:#98A2B8; --line:#2A3345;
    --study:#7C9BFF; --study-bg:#202B4D; --life:#4CCFA3; --life-bg:#17342D;
    --accent:#E7EBF3; --accent-ink:#10141D; --danger:#FF7B7B; --track:#2A3345;
  }
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:22px;margin:0 0 16px;font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--study);outline-offset:2px}

.datebar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.datebar .label{flex:1;font-size:17px;font-weight:500}
.datebar .label small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.text-btn{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.datebar input[type=date]{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.counts{display:flex;gap:8px;margin-bottom:14px}
.count{flex:1}
.count b{display:block;font-size:30px;line-height:1.1;font-weight:700}
.count span{color:var(--muted);font-size:13px}
.pct{font-size:30px;font-weight:700;text-align:right}
.track{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.fill{height:100%;width:0;background:var(--life);border-radius:99px;transition:width .3s}
.msg{margin:10px 0 0;color:var(--muted);font-size:14px}

.add{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px}
.add .row{display:flex;gap:8px}
.add input[type=text]{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.add .go{height:42px;padding:0 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{height:32px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:14px}
.seg button[aria-pressed="true"][data-c="study"]{background:var(--study-bg);border-color:var(--study);color:var(--study)}
.seg button[aria-pressed="true"][data-c="life"]{background:var(--life-bg);border-color:var(--life);color:var(--life)}

.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-left-width:4px}
li.study{border-left-color:var(--study)}
li.life{border-left-color:var(--life)}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--life);flex:none}
li .t{flex:1;min-width:0;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--muted)}
li .tag{font-size:12px;padding:2px 8px;border-radius:99px;flex:none}
li.study .tag{background:var(--study-bg);color:var(--study)}
li.life .tag{background:var(--life-bg);color:var(--life)}
li .acts{display:flex;gap:4px;flex:none}
li .acts button{height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted)}
li .acts button.del{color:var(--danger)}
li .edit{flex:1;min-width:0;height:34px;border-radius:8px;border:1px solid var(--study);background:var(--bg);padding:0 10px}
.empty{text-align:center;color:var(--muted);padding:28px 8px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.foot{display:flex;justify-content:flex-end;margin-top:12px}
.foot button{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}
@media (max-width:480px){ li{flex-wrap:wrap} li .t{flex-basis:calc(100% - 40px)} }
@media (prefers-reduced-motion: reduce){ .fill{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>오늘의 할 일</h1>

  <div class="datebar">
    <button class="icon-btn" id="prev" aria-label="이전 날짜">‹</button>
    <div class="label" id="dateLabel"></div>
    <button class="icon-btn" id="next" aria-label="다음 날짜">›</button>
    <input type="date" id="datePick" aria-label="날짜 선택">
    <button class="text-btn" id="today">오늘</button>
  </div>

  <section class="summary" aria-label="진행 상황">
    <div class="counts">
      <div class="count"><b id="cTotal">0</b><span>전체</span></div>
      <div class="count"><b id="cLeft">0</b><span>남은 일</span></div>
      <div class="count"><b id="cDone">0</b><span>완료</span></div>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div>
    <p class="msg" id="msg"></p>
  </section>

  <section class="add">
    <div class="row">
      <input type="text" id="newText" placeholder="할 일을 입력하세요" maxlength="100" aria-label="새 할 일">
      <button class="go" id="addBtn">추가</button>
    </div>
    <div class="seg" role="group" aria-label="분류 선택">
      <button type="button" data-c="study" aria-pressed="true">학업</button>
      <button type="button" data-c="life" aria-pressed="false">일상</button>
    </div>
  </section>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-f="all" aria-selected="true">전체</button>
    <button role="tab" data-f="study" aria-selected="false">학업</button>
    <button role="tab" data-f="life" aria-selected="false">일상</button>
  </div>

  <ul id="list"></ul>
  <div class="foot"><button id="clearDone">완료한 일 모두 지우기</button></div>
</div>

<script>
(function(){
  var KEY = "todo-today-v1";
  var CAT = { study: "학업", life: "일상" };
  var todos = [];
  try { todos = JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { todos = []; }

  var state = { date: ymd(new Date()), filter: "all", cat: "study", editing: null };
  var $ = function(id){ return document.getElementById(id); };

  function ymd(d){
    var m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function parse(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} }
  function shift(n){ var d = parse(state.date); d.setDate(d.getDate()+n); state.date = ymd(d); state.editing = null; render(); }

  function dayItems(){ return todos.filter(function(t){ return t.date === state.date; }); }

  function render(){
    var d = parse(state.date);
    var wd = ["일","월","화","수","목","금","토"][d.getDay()];
    var isToday = state.date === ymd(new Date());
    $("dateLabel").innerHTML = "";
    $("dateLabel").appendChild(document.createTextNode((d.getMonth()+1) + "월 " + d.getDate() + "일 (" + wd + ")"));
    var sm = document.createElement("small");
    sm.textContent = isToday ? "오늘" : d.getFullYear() + "년";
    $("dateLabel").appendChild(sm);
    $("datePick").value = state.date;

    var all = dayItems();
    var done = all.filter(function(t){ return t.done; }).length;
    var left = all.length - done;
    var pct = all.length ? Math.round(done / all.length * 100) : 0;
    $("cTotal").textContent = all.length;
    $("cLeft").textContent = left;
    $("cDone").textContent = done;
    $("pct").textContent = pct + "%";
    $("fill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", pct);
    $("msg").textContent = !all.length ? "이 날의 할 일을 추가해 보세요."
      : left === 0 ? "모두 끝냈어요. 수고했어요!"
      : left + "개 남았어요.";

    var tabs = $("tabs").querySelectorAll("button");
    for (var i = 0; i < tabs.length; i++){
      var f = tabs[i].getAttribute("data-f");
      var n = f === "all" ? all.length : all.filter(function(t){ return t.cat === f; }).length;
      tabs[i].textContent = (f === "all" ? "전체" : CAT[f]) + " " + n;
      tabs[i].setAttribute("aria-selected", f === state.filter ? "true" : "false");
    }

    var shown = all.filter(function(t){ return state.filter === "all" || t.cat === state.filter; });
    var ul = $("list");
    ul.innerHTML = "";
    if (!shown.length){
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = all.length ? "이 분류에는 할 일이 없어요." : "아직 할 일이 없어요. 위에서 추가해 보세요.";
      ul.appendChild(e);
    }
    shown.forEach(function(t){ ul.appendChild(row(t)); });
    $("clearDone").style.visibility = done ? "visible" : "hidden";
  }

  function row(t){
    var li = document.createElement("li");
    li.className = t.cat + (t.done ? " done" : "");

    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!t.done;
    cb.setAttribute("aria-label", "완료 표시: " + t.text);
    cb.onchange = function(){ t.done = cb.checked; save(); render(); };
    li.appendChild(cb);

    if (state.editing === t.id){
      var inp = document.createElement("input");
      inp.type = "text"; inp.className = "edit"; inp.value = t.text; inp.maxLength = 100;
      inp.setAttribute("aria-label", "할 일 수정");
      var commit = function(){
        var v = inp.value.trim();
        if (v) { t.text = v; save(); }
        state.editing = null; render();
      };
      inp.onkeydown = function(ev){
        if (ev.key === "Enter") commit();
        if (ev.key === "Escape") { state.editing = null; render(); }
      };
      li.appendChild(inp);
      var acts = document.createElement("div"); acts.className = "acts";
      var ok = document.createElement("button"); ok.textContent = "저장"; ok.onclick = commit;
      var no = document.createElement("button"); no.textContent = "취소"; no.onclick = function(){ state.editing = null; render(); };
      acts.appendChild(ok); acts.appendChild(no); li.appendChild(acts);
      setTimeout(function(){ inp.focus(); inp.select(); }, 0);
      return li;
    }

    var tx = document.createElement("span"); tx.className = "t"; tx.textContent = t.text; li.appendChild(tx);
    var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = CAT[t.cat]; li.appendChild(tag);

    var a = document.createElement("div"); a.className = "acts";
    var ed = document.createElement("button"); ed.textContent = "수정";
    ed.onclick = function(){ state.editing = t.id; render(); };
    var de = document.createElement("button"); de.textContent = "삭제"; de.className = "del";
    de.onclick = function(){ todos = todos.filter(function(x){ return x.id !== t.id; }); save(); render(); };
    a.appendChild(ed); a.appendChild(de); li.appendChild(a);
    return li;
  }

  function add(){
    var v = $("newText").value.trim();
    if (!v) { $("newText").focus(); return; }
    todos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), date: state.date, text: v, cat: state.cat, done: false });
    save();
    $("newText").value = "";
    $("newText").focus();
    render();
  }

  $("addBtn").onclick = add;
  $("newText").onkeydown = function(e){ if (e.key === "Enter") add(); };
  $("prev").onclick = function(){ shift(-1); };
  $("next").onclick = function(){ shift(1); };
  $("today").onclick = function(){ state.date = ymd(new Date()); state.editing = null; render(); };
  $("datePick").onchange = function(){ if (this.value) { state.date = this.value; state.editing = null; render(); } };

  var segs = document.querySelectorAll(".seg button");
  for (var i = 0; i < segs.length; i++){
    segs[i].onclick = function(){
      state.cat = this.getAttribute("data-c");
      for (var j = 0; j < segs.length; j++) segs[j].setAttribute("aria-pressed", segs[j] === this ? "true" : "false");
    };
  }
  var tb = $("tabs").querySelectorAll("button");
  for (var k = 0; k < tb.length; k++){
    tb[k].onclick = function(){ state.filter = this.getAttribute("data-f"); render(); };
  }
  $("clearDone").onclick = function(){
    todos = todos.filter(function(t){ return !(t.date === state.date && t.done); });
    save(); render();
  };

  render();
})();
</script>
</body>
</html>
