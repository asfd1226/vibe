<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤형열 | 개인 홈페이지</title>
<meta name="description" content="문정25윤형열의 개인 홈페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f6;
    --ink: #16213a;
    --muted: #55607a;
    --line: #c9d2e0;
    --accent: #2d4bff;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10172a;
      --ink: #e8edf8;
      --muted: #a3aec7;
      --line: #2b3652;
      --accent: #8fa2ff;
      --accent-ink: #10172a;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: 6rem 1.5rem 4rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(3.5rem, 15vw, 7rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.04em;
  }
  .tagline {
    margin: 1.25rem 0 0;
    font-size: 1.25rem;
    color: var(--accent);
    font-weight: 500;
  }
  section { margin-top: 4rem; }
  h2 {
    margin: 0 0 1rem;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--muted);
  }
  dl { margin: 0; border-top: 1px solid var(--line); }
  .row {
    display: grid;
    grid-template-columns: 7rem 1fr;
    gap: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--line);
  }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-all; }
  a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 0.25em; }
  a:hover { color: var(--accent); }
  a:focus-visible, .project:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }
  .projects { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .projects li { border-bottom: 1px solid var(--line); }
  .project {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 0;
    text-decoration: none;
    font-weight: 500;
  }
  .project span:last-child {
    color: var(--accent-ink);
    background: var(--accent);
    padding: 0.2rem 0.8rem;
    border-radius: 999px;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .project:hover { color: var(--accent); }
  footer { margin-top: 5rem; color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 30rem) {
    main { padding-top: 4rem; }
    .row { grid-template-columns: 1fr; gap: 0.1rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>윤형열</h1>
    <p class="tagline">문정25윤형열</p>
  </header>

  <section aria-labelledby="about">
    <h2 id="about">기본 정보</h2>
    <dl>
      <div class="row">
        <dt>이름</dt>
        <dd>윤형열</dd>
      </div>
      <div class="row">
        <dt>이메일</dt>
        <dd><a href="mailto:hy0004@smail.kongju.ac.kr">hy0004@smail.kongju.ac.kr</a></dd>
      </div>
      <div class="row">
        <dt>관심사</dt>
        <dd>여러 가지</dd>
      </div>
      <div class="row">
        <dt>주요 활동</dt>
        <dd>이것저것 해볼 예정입니다.</dd>
      </div>
    </dl>
  </section>

  <section aria-labelledby="projects">
    <h2 id="projects">프로젝트</h2>
    <ul class="projects">
      <li>
        <a class="project" href="todo-today.html">
          <span>오늘의 할일 만들기</span>
          <span>열기</span>
        </a>
      </li>
    </ul>
  </section>

  <footer>© 2026 윤형열</footer>
</main>
</body>
</html>
